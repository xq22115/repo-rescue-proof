name: Public PowerShell Automatic Variable Guard

on:
  push:
    branches:
      - diagnostics/public-standard-hosted-runner-canary-20260822
    paths:
      - 'diagnostics/powershell-automatic-variable-guard/**'
      - '.github/workflows/public-powershell-automatic-variable-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automatic-variable-guard:
    name: ${{ matrix.os }} PowerShell automatic-variable guard
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Mark native Windows diagnostic started
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeWindowsObserved = [System.Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([System.Runtime.InteropServices.OSPlatform]::Windows)
          if (-not $nativeWindowsObserved) { throw 'POWERSHELL_AUTOMATIC_VARIABLE_GUARD_NOT_WINDOWS' }
          if ($env:RUNNER_OS -ne 'Windows') { throw "RUNNER_OS_MISMATCH observed=$env:RUNNER_OS" }
          if (-not [Environment]::Is64BitOperatingSystem) { throw 'POWERSHELL_AUTOMATIC_VARIABLE_GUARD_REQUIRES_64BIT_WINDOWS' }
          Write-Output 'runner_started=true'
          Write-Output "runner_os=$env:RUNNER_OS"
          Write-Output "runner_arch=$env:RUNNER_ARCH"
          Write-Output "os_version=$([Environment]::OSVersion.VersionString)"

      - name: Checkout diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Windows PowerShell 5.1 runtime identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            throw "Expected Windows PowerShell Desktop edition, observed $($PSVersionTable.PSEdition)."
          }
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Expected Windows PowerShell 5.1, observed $($PSVersionTable.PSVersion)."
          }
          Write-Output "powershell_edition=$($PSVersionTable.PSEdition)"
          Write-Output "powershell_version=$($PSVersionTable.PSVersion)"

      - name: Run automatic-variable guard with Windows PowerShell 5.1
        shell: powershell
        run: .\diagnostics\powershell-automatic-variable-guard\Test-Scripts.ps1 -Root .\diagnostics\powershell-automatic-variable-guard

      - name: Verify PowerShell 7 runtime identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Core') {
            throw "Expected PowerShell Core edition, observed $($PSVersionTable.PSEdition)."
          }
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "Expected PowerShell 7 or later, observed $($PSVersionTable.PSVersion)."
          }
          Write-Output "powershell_edition=$($PSVersionTable.PSEdition)"
          Write-Output "powershell_version=$($PSVersionTable.PSVersion)"

      - name: Run automatic-variable guard with PowerShell 7
        shell: pwsh
        run: .\diagnostics\powershell-automatic-variable-guard\Test-Scripts.ps1 -Root .\diagnostics\powershell-automatic-variable-guard

      - name: State diagnostic boundary
        if: ${{ always() }}
        shell: pwsh
        run: |
          @"
          ## Public automatic-variable guard boundary

          This public diagnostic contains no private braintrust evidence. A PASS proves only that the mirrored automatic-variable guard and its fixtures execute on this GitHub-hosted Windows image under Windows PowerShell 5.1 and PowerShell 7.

          It does not accept the private braintrust portable Windows contract, target ODR/WinGet MCP behavior, MCP semantics, or final Windows state.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
