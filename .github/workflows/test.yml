name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_repo_rescue_proof.py

  windows-2022-assignment-canary:
    runs-on: windows-2022
    steps:
      - name: Mark runner started
        shell: pwsh
        run: |
          Write-Output 'runner_started=true'
          Write-Output "runner_os=${{ runner.os }}"
          Write-Output "runner_arch=${{ runner.arch }}"

  windows-latest-assignment-canary:
    runs-on: windows-latest
    steps:
      - name: Mark runner started
        shell: pwsh
        run: |
          Write-Output 'runner_started=true'
          Write-Output "runner_os=${{ runner.os }}"
          Write-Output "runner_arch=${{ runner.arch }}"
