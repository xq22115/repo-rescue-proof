name: PR evidence gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required evidence sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          required = [
              "Root goal",
              "Source of truth",
              "Executed actions",
              "Read-back evidence",
              "Tests",
              "Cross-checks",
              "Remaining gaps",
          ]

          errors = []
          for heading in required:
              pattern = re.compile(
                  rf"(?ims)^##\s+{re.escape(heading)}\s*$\n(.*?)(?=^##\s+|\Z)"
              )
              match = pattern.search(body)
              if not match:
                  errors.append(f"missing section: ## {heading}")
                  continue

              content = re.sub(r"<!--.*?-->", "", match.group(1), flags=re.S).strip()
              if not content:
                  errors.append(f"empty section: ## {heading}")

          if not re.search(r"\b(PASS|FAIL|BLOCKED|NOT RUN)\b", body, flags=re.I):
              errors.append("missing explicit status: PASS / FAIL / BLOCKED / NOT RUN")

          if errors:
              print("PR evidence gate failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("PR evidence gate passed.")
          PY
