name: PR evidence gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required evidence sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          required = [
              "Root goal",
              "Source of truth",
              "Executed actions",
              "Read-back evidence",
              "Tests",
              "Cross-checks",
              "Remaining gaps",
              "Final status",
          ]

          def section(heading):
              pattern = re.compile(
                  rf"(?ims)^##\s+{re.escape(heading)}\s*$\n(.*?)(?=^##\s+|\Z)"
              )
              match = pattern.search(body)
              if not match:
                  return None
              return re.sub(r"<!--.*?-->", "", match.group(1), flags=re.S).strip()

          errors = []
          sections = {}
          for heading in required:
              content = section(heading)
              if content is None:
                  errors.append(f"missing section: ## {heading}")
              elif not content:
                  errors.append(f"empty section: ## {heading}")
              else:
                  sections[heading] = content

          for heading in ("Read-back evidence", "Tests", "Cross-checks"):
              content = sections.get(heading, "")
              if not re.search(r"\bPASS\b", content, flags=re.I):
                  errors.append(f"{heading} must contain PASS evidence")
              if re.search(r"\b(FAIL|BLOCKED|NOT\s+RUN)\b", content, flags=re.I):
                  errors.append(f"{heading} still contains a non-passing status")

          remaining = sections.get("Remaining gaps", "")
          if remaining and not re.fullmatch(r"(?is)none\.?", remaining.strip()):
              errors.append("Remaining gaps must be exactly None before final acceptance")

          final_status = sections.get("Final status", "")
          if final_status and not re.fullmatch(r"(?is)PASS\.?", final_status.strip()):
              errors.append("Final status must be exactly PASS")

          if errors:
              print("PR evidence gate failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("PR evidence gate passed.")
          PY
