name: Public Windows MCP stdio frame canary

on:
  pull_request:
    paths:
      - 'diagnostics/mcp-stdio-frame-canary/**'
      - '.github/workflows/public-windows-mcp-stdio-frame-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-canary:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout revision
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) { throw "HEAD mismatch: $actual != $env:EXPECTED_HEAD_SHA" }

      - name: Run stdio frame canary on Windows PowerShell 5.1
        shell: powershell
        run: |
          .\diagnostics\mcp-stdio-frame-canary\Test-Mcp-StdioFrameCanary.ps1 -OutputPath "artifacts\${{ matrix.os }}-ps51.json"

      - name: Run stdio frame canary on PowerShell 7
        shell: pwsh
        run: |
          .\diagnostics\mcp-stdio-frame-canary\Test-Mcp-StdioFrameCanary.ps1 -OutputPath "artifacts\${{ matrix.os }}-ps7.json"

      - name: Upload stdio frame evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stdio-frame-${{ matrix.os }}
          path: artifacts/*.json
          if-no-files-found: error
