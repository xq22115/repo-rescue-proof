name: Diagnose Process.Modules cross-bitness completeness

on:
  push:
    branches:
      - diagnostic/windows-processmodules-bitness-20260824
    paths:
      - 'diagnostics/windows-processmodules-bitness-canary.ps1'
      - 'diagnostics/Get-Windows-ProcessModulesArchitectureEvidence.ps1'
      - 'diagnostics/test-processmodules-architecture-helper.ps1'
      - 'diagnostics/Get-Windows-ProcessModuleInventory.ps1'
      - '.github/workflows/diagnose-processmodules-cross-bitness.yml'
  pull_request:
    paths:
      - 'diagnostics/windows-processmodules-bitness-canary.ps1'
      - 'diagnostics/Get-Windows-ProcessModulesArchitectureEvidence.ps1'
      - 'diagnostics/test-processmodules-architecture-helper.ps1'
      - 'diagnostics/Get-Windows-ProcessModuleInventory.ps1'
      - '.github/workflows/diagnose-processmodules-cross-bitness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2022:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify integrated helper identity
        shell: pwsh
        run: |
          $observed = (git hash-object diagnostics/Get-Windows-ProcessModuleInventory.ps1).Trim()
          if ($observed -ne '765df91ecd81747ec827b435773b6827b0be13a1') { throw "Integrated helper blob drifted: $observed" }
          Write-Host "MODULE_INVENTORY_V2_GIT_BLOB=$observed"
      - name: Windows PowerShell 5.1 cross-bitness canary
        shell: powershell
        run: .\diagnostics\windows-processmodules-bitness-canary.ps1 -OutputPath .\artifacts\windows-2022-ps51.json
      - name: PowerShell 7 cross-bitness canary
        shell: pwsh
        run: .\diagnostics\windows-processmodules-bitness-canary.ps1 -OutputPath .\artifacts\windows-2022-ps7.json
      - name: Windows PowerShell 5.1 architecture helper contract
        shell: powershell
        run: .\diagnostics\test-processmodules-architecture-helper.ps1 -OutputDirectory .\artifacts\helper-ps51
      - name: PowerShell 7 architecture helper contract
        shell: pwsh
        run: .\diagnostics\test-processmodules-architecture-helper.ps1 -OutputDirectory .\artifacts\helper-ps7
      - name: Windows PowerShell 5.1 integrated inventory v2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version Latest
          $p=Get-Process -Id $PID; $path=[string]$p.Path; if([string]::IsNullOrWhiteSpace($path)){$path=[string]$p.MainModule.FileName}
          $path=[IO.Path]::GetFullPath($path); $sha=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); $r='.\artifacts\integrated-ps51.json'
          $o=& .\diagnostics\Get-Windows-ProcessModuleInventory.ps1 -ProcessId $PID -ExpectedExecutablePath $path -ExpectedExecutableSha256 $sha -OutputReceiptPath $r
          if(-not $o.processModulesSameArchitecturePrerequisiteAccepted -or $o.processModulesEnumerationCompletenessProven){throw 'Integrated v2 architecture boundary failed.'}
          $j=Get-Content -LiteralPath $r -Raw|ConvertFrom-Json; if([int]$j.schemaVersion-ne 2 -or -not [bool]$j.acceptanceBoundary.moduleInventorySnapshotAccepted -or [bool]$j.acceptanceBoundary.processModulesEnumerationCompletenessProven){throw 'Integrated v2 receipt boundary failed.'}
          Write-Host "INTEGRATED_V2_PS51=PASS MODULES=$($j.moduleInventory.moduleCount) MACHINE=$($j.process.effectiveMachine)"
      - name: PowerShell 7 integrated inventory v2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version Latest
          $p=Get-Process -Id $PID; $path=[string]$p.Path; if([string]::IsNullOrWhiteSpace($path)){$path=[string]$p.MainModule.FileName}
          $path=[IO.Path]::GetFullPath($path); $sha=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); $r='.\artifacts\integrated-ps7.json'
          $o=& .\diagnostics\Get-Windows-ProcessModuleInventory.ps1 -ProcessId $PID -ExpectedExecutablePath $path -ExpectedExecutableSha256 $sha -OutputReceiptPath $r
          if(-not $o.processModulesSameArchitecturePrerequisiteAccepted -or $o.processModulesEnumerationCompletenessProven){throw 'Integrated v2 architecture boundary failed.'}
          $j=Get-Content -LiteralPath $r -Raw|ConvertFrom-Json; if([int]$j.schemaVersion-ne 2 -or -not [bool]$j.acceptanceBoundary.moduleInventorySnapshotAccepted -or [bool]$j.acceptanceBoundary.processModulesEnumerationCompletenessProven){throw 'Integrated v2 receipt boundary failed.'}
          Write-Host "INTEGRATED_V2_PS7=PASS MODULES=$($j.moduleInventory.moduleCount) MACHINE=$($j.process.effectiveMachine)"
      - uses: actions/upload-artifact@v4
        with:
          name: processmodules-bitness-windows-2022
          path: artifacts/**/*.json

  windows-latest:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
