name: Public Windows MCP stdio single-write canary

on:
  push:
    branches:
      - diagnostics/public-standard-hosted-runner-canary-20260822
    paths:
      - 'diagnostics/mcp-stdio-write-canary/**'
      - '.github/workflows/public-windows-mcp-stdio-write-canary.yml'
  pull_request:
    paths:
      - 'diagnostics/mcp-stdio-write-canary/**'
      - '.github/workflows/public-windows-mcp-stdio-write-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-write-canary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            edition: ps51
            shell_name: powershell
            expect_standard_input_encoding: unavailable
          - os: windows-2022
            edition: ps7
            shell_name: pwsh
            expect_standard_input_encoding: available
          - os: windows-latest
            edition: ps51
            shell_name: powershell
            expect_standard_input_encoding: unavailable
          - os: windows-latest
            edition: ps7
            shell_name: pwsh
            expect_standard_input_encoding: available
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout revision
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) { throw "HEAD mismatch: $actual != $env:EXPECTED_HEAD_SHA" }
          "MCP_STDIO_WRITE_CANARY_EXACT_HEAD=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify redirected-stdin behavior
        shell: ${{ matrix.shell_name }}
        env:
          EXPECT_STANDARD_INPUT_ENCODING: ${{ matrix.expect_standard_input_encoding }}
        run: |
          $output = "artifacts\${{ matrix.os }}-${{ matrix.edition }}.json"
          if ($env:EXPECT_STANDARD_INPUT_ENCODING -eq 'unavailable') {
            $caught = $null
            try {
              .\diagnostics\mcp-stdio-write-canary\Test-Mcp-StdioWriteCanary.ps1 -OutputPath $output
            } catch {
              $caught = $_
            }
            if ($null -eq $caught) {
              throw 'Windows PowerShell 5.1 unexpectedly completed the no-BOM Process.StandardInput canary; update the diagnostic contract before accepting this behavior change.'
            }
            if ($caught.Exception.Message -notmatch 'StandardInputEncoding') {
              throw "Windows PowerShell 5.1 failed for an unexpected reason: $($caught.Exception.Message)"
            }
            Write-Host 'MCP_STDIO_PS51_STANDARDINPUTENCODING_UNAVAILABLE_CONFIRMED'
          } else {
            .\diagnostics\mcp-stdio-write-canary\Test-Mcp-StdioWriteCanary.ps1 -OutputPath $output
          }

      - name: Upload stdio single-write evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stdio-single-write-${{ matrix.os }}-${{ matrix.edition }}
          path: artifacts/*.json
          if-no-files-found: warn
