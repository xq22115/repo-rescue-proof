name: Public Windows MCP stdio single-write canary

on:
  push:
    branches:
      - diagnostics/public-standard-hosted-runner-canary-20260822
    paths:
      - 'diagnostics/mcp-stdio-write-canary/**'
      - '.github/workflows/public-windows-mcp-stdio-write-canary.yml'
  pull_request:
    paths:
      - 'diagnostics/mcp-stdio-write-canary/**'
      - '.github/workflows/public-windows-mcp-stdio-write-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-write-canary:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout revision
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) { throw "HEAD mismatch: $actual != $env:EXPECTED_HEAD_SHA" }
          "MCP_STDIO_WRITE_CANARY_EXACT_HEAD=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run single-write canary on Windows PowerShell 5.1
        shell: powershell
        run: |
          .\diagnostics\mcp-stdio-write-canary\Test-Mcp-StdioWriteCanary.ps1 -OutputPath "artifacts\${{ matrix.os }}-ps51.json"

      - name: Run single-write canary on PowerShell 7
        shell: pwsh
        run: |
          .\diagnostics\mcp-stdio-write-canary\Test-Mcp-StdioWriteCanary.ps1 -OutputPath "artifacts\${{ matrix.os }}-ps7.json"

      - name: Upload stdio single-write evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-stdio-single-write-${{ matrix.os }}
          path: artifacts/*.json
          if-no-files-found: error
