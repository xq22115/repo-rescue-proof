name: Validate Spawn-Bound Process Module Inventory

on:
  push:
    branches:
      - diagnostic/windows-processmodules-bitness-20260824
    paths:
      - 'diagnostics/Get-Windows-Mcp-SpawnedProcessIdentityEvidence.ps1'
      - 'diagnostics/Get-Windows-Mcp-SpawnBoundProcessModuleInventoryEvidence.ps1'
      - 'diagnostics/Get-Windows-ProcessModuleInventory.ps1'
      - '.github/workflows/validate-spawn-bound-processmodule-inventory.yml'
  pull_request:
    paths:
      - 'diagnostics/Get-Windows-Mcp-SpawnedProcessIdentityEvidence.ps1'
      - 'diagnostics/Get-Windows-Mcp-SpawnBoundProcessModuleInventoryEvidence.ps1'
      - 'diagnostics/Get-Windows-ProcessModuleInventory.ps1'
      - '.github/workflows/validate-spawn-bound-processmodule-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-spawn-bound-inventory:
    name: ${{ matrix.image }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: windows-2022
            shell: powershell
            expectedEdition: Desktop
          - image: windows-2022
            shell: pwsh
            expectedEdition: Core
          - image: windows-latest
            shell: powershell
            expectedEdition: Desktop
          - image: windows-latest
            shell: pwsh
            expectedEdition: Core
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact diagnostic revision and private-production blobs
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $observedHead = (git rev-parse HEAD).Trim()
          if ($observedHead -ne $env:EXPECTED_HEAD_SHA) { throw "Checkout head mismatch. expected=$env:EXPECTED_HEAD_SHA actual=$observedHead" }

          $expected = @{
            'diagnostics/Get-Windows-Mcp-SpawnedProcessIdentityEvidence.ps1' = 'e15948dfa1e308c06250433ddf8c3d4718b3aa5b'
            'diagnostics/Get-Windows-Mcp-SpawnBoundProcessModuleInventoryEvidence.ps1' = '03017f8125baf56eae4046441e50356f7c643be5'
            'diagnostics/Get-Windows-ProcessModuleInventory.ps1' = '9481e1b4d25ec3977614b554d252aa84275dca48'
          }
          foreach ($path in $expected.Keys) {
            $observedBlob = (git hash-object $path).Trim()
            if ($observedBlob -ne $expected[$path]) { throw "Diagnostic helper blob drifted. path=$path expected=$($expected[$path]) actual=$observedBlob" }
            Write-Host "BLOB[$path]=$observedBlob"
          }
          Write-Host "DIAGNOSTIC_HEAD=$observedHead"

      - name: Run spawn-bound process/module lifetime contract
        shell: ${{ matrix.shell }}
        env:
          EXPECTED_EDITION: ${{ matrix.expectedEdition }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ([string]$PSVersionTable.PSEdition -ne $env:EXPECTED_EDITION) {
            throw "Unexpected PowerShell edition. expected=$env:EXPECTED_EDITION actual=$($PSVersionTable.PSEdition)"
          }

          $spawnHelper = Join-Path $PWD 'diagnostics/Get-Windows-Mcp-SpawnedProcessIdentityEvidence.ps1'
          $boundHelper = Join-Path $PWD 'diagnostics/Get-Windows-Mcp-SpawnBoundProcessModuleInventoryEvidence.ps1'
          $current = Get-Process -Id $PID -ErrorAction Stop
          $currentPath = $null
          try { $currentPath = [string]$current.Path } catch { }
          if ([string]::IsNullOrWhiteSpace($currentPath)) {
            try { $currentPath = [string]$current.MainModule.FileName } catch { }
          }
          if ([string]::IsNullOrWhiteSpace($currentPath)) { throw 'Unable to resolve current PowerShell executable.' }
          $currentPath = [System.IO.Path]::GetFullPath($currentPath)
          $currentSha = (Get-FileHash -LiteralPath $currentPath -Algorithm SHA256).Hash.ToLowerInvariant()

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $currentPath
          $psi.Arguments = '-NoLogo -NoProfile -Command "Start-Sleep -Seconds 60"'
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $child = New-Object System.Diagnostics.Process
          $child.StartInfo = $psi

          $spawnReceipt = Join-Path $env:RUNNER_TEMP ('spawn-identity-' + [guid]::NewGuid().ToString('N') + '.json')
          $boundReceipt = Join-Path $env:RUNNER_TEMP ('spawn-bound-modules-' + [guid]::NewGuid().ToString('N') + '.json')
          try {
            $spawnStart = [datetimeoffset]::UtcNow
            if (-not $child.Start()) { throw 'Failed to start child PowerShell process.' }
            $childPid = $child.Id
            $spawnEnd = [datetimeoffset]::UtcNow

            $spawnResult = & $spawnHelper `
              -ProcessId $childPid `
              -ExpectedExecutablePath $currentPath `
              -ExpectedExecutableSha256 $currentSha `
              -SpawnWindowStartUtc $spawnStart.ToString('o') `
              -SpawnWindowEndUtc $spawnEnd.ToString('o') `
              -ReceiptPath $spawnReceipt
            if (-not [bool]$spawnResult.spawnedProcessIdentityAccepted) { throw 'Spawned-process identity was not accepted.' }
            $spawnSha = [string]$spawnResult.receiptSha256
            if ($spawnSha -notmatch '^[0-9a-f]{64}$') { throw 'Spawned-process receipt SHA is invalid.' }
            if ((Get-FileHash -LiteralPath $spawnReceipt -Algorithm SHA256).Hash.ToLowerInvariant() -ne $spawnSha) { throw 'Spawned-process receipt read-back SHA mismatch.' }

            $boundResult = & $boundHelper `
              -SpawnedProcessIdentityReceiptPath $spawnReceipt `
              -SpawnedProcessIdentityReceiptSha256 $spawnSha `
              -ReceiptPath $boundReceipt
            if (-not [bool]$boundResult.moduleInventoryBoundToSpawnedProcessLifetime) { throw 'Spawn-bound module inventory was not accepted.' }
            if (-not [bool]$boundResult.processModulesSameArchitecturePrerequisiteAccepted) { throw 'Same-architecture prerequisite was not accepted.' }
            if ([bool]$boundResult.processModulesEnumerationCompletenessProven) { throw 'Process.Modules completeness must remain unproven.' }
            if ([bool]$boundResult.dependentModuleTrustAccepted) { throw 'Dependent-module trust must remain unaccepted.' }

            $receipt = Get-Content -LiteralPath $boundReceipt -Raw | ConvertFrom-Json
            if ([string]$receipt.component -ne 'windows-mcp-spawn-bound-process-module-inventory-evidence') { throw 'Unexpected spawn-bound receipt component.' }
            if ([int]$receipt.schemaVersion -ne 1) { throw 'Unexpected spawn-bound receipt schema.' }
            if ([int]$receipt.spawnedProcessIdentity.pid -ne $childPid) { throw 'Spawn-bound receipt PID mismatch.' }
            if ([int]$receipt.lifetimeRebind.beforeModuleInventory.pid -ne $childPid) { throw 'Pre-inventory lifetime PID mismatch.' }
            if ([int]$receipt.lifetimeRebind.afterModuleInventory.pid -ne $childPid) { throw 'Post-inventory lifetime PID mismatch.' }
            if (-not [bool]$receipt.acceptanceBoundary.moduleInventoryBoundToSpawnedProcessLifetime) { throw 'Receipt did not preserve lifetime binding acceptance.' }
            if (-not [bool]$receipt.acceptanceBoundary.liveProcessReboundBeforeModuleInventory) { throw 'Pre-inventory live process rebind missing.' }
            if (-not [bool]$receipt.acceptanceBoundary.liveProcessReboundAfterModuleInventory) { throw 'Post-inventory live process rebind missing.' }
            if ([bool]$receipt.acceptanceBoundary.processLifetimeRaceFree) { throw 'Receipt must not overclaim race-free process lifetime.' }
            if ([bool]$receipt.acceptanceBoundary.processModulesEnumerationCompletenessProven) { throw 'Receipt must not overclaim Process.Modules completeness.' }
            if ([bool]$receipt.acceptanceBoundary.downstreamMcpServerPhysicalIdentityAccepted) { throw 'Receipt must not overclaim downstream MCP server identity.' }
            if ([bool]$receipt.acceptanceBoundary.mcpProtocolRuntimeAccepted) { throw 'Receipt must not overclaim MCP protocol runtime.' }
            if ([bool]$receipt.acceptanceBoundary.semanticToolAccepted) { throw 'Receipt must not overclaim MCP semantics.' }
            if ([bool]$receipt.acceptanceBoundary.windowsFinalStateAccepted) { throw 'Receipt must not overclaim final Windows state.' }

            # Self-consistent stale-lifetime receipt must still fail closed.
            $staleReceipt = Join-Path $env:RUNNER_TEMP ('stale-spawn-' + [guid]::NewGuid().ToString('N') + '.json')
            $stale = Get-Content -LiteralPath $spawnReceipt -Raw | ConvertFrom-Json
            $stale.observedProcess.startTimeUtc = '2000-01-01T00:00:00.0000000Z'
            $utf8 = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($staleReceipt, ($stale | ConvertTo-Json -Depth 10), $utf8)
            $staleSha = (Get-FileHash -LiteralPath $staleReceipt -Algorithm SHA256).Hash.ToLowerInvariant()
            $staleBound = Join-Path $env:RUNNER_TEMP ('stale-bound-' + [guid]::NewGuid().ToString('N') + '.json')
            $staleRejected = $false
            try {
              & $boundHelper -SpawnedProcessIdentityReceiptPath $staleReceipt -SpawnedProcessIdentityReceiptSha256 $staleSha -ReceiptPath $staleBound | Out-Null
            } catch {
              $staleRejected = $true
              Write-Host "EXPECTED_STALE_LIFETIME_VETO=$($_.Exception.Message)"
            }
            if (-not $staleRejected) { throw 'Self-consistent stale process lifetime receipt was not rejected.' }

            Write-Host 'SPAWN_BOUND_PROCESS_MODULE_INVENTORY=PASS'
            Write-Host "POWERSHELL_EDITION=$($PSVersionTable.PSEdition)"
            Write-Host "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
            Write-Host "CHILD_PID=$childPid"
            Write-Host "MODULE_COUNT=$($boundResult.moduleCount)"
            Write-Host "MODULE_SET_FINGERPRINT_SHA256=$($boundResult.moduleSetFingerprintSha256)"
          } finally {
            try {
              if ($null -ne $child -and -not $child.HasExited) {
                $child.Kill()
                [void]$child.WaitForExit(5000)
              }
            } catch { }
            if ($null -ne $child) { $child.Dispose() }
          }

      - name: State acceptance boundary
        shell: pwsh
        run: |
          @'
          ## Spawn-bound Process.Modules lifetime diagnostic

          - This run executes the exact private spawned-process helper, exact private schema-v2 module-inventory helper, and exact private spawn-bound wrapper bytes on native GitHub-hosted Windows.
          - It proves the module snapshot is attributed to the same observed PID lifetime (PID + StartTime + image path/SHA) before and after inventory for this diagnostic child process.
          - It also proves a self-consistent stale StartTime receipt is rejected.
          - It does **not** prove race-free lifetime binding, Process.Modules completeness, dependent-module trust, late-load coverage, downstream MCP server physical identity, protocol health, tool semantics, or final Windows state.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
