name: Public PowerShell Variable Provider Current-Location Canary

on:
  push:
    branches:
      - diagnostics/public-standard-hosted-runner-canary-20260822
    paths:
      - '.github/workflows/public-powershell-variable-provider-current-location-canary.yml'
      - 'diagnostics/powershell-automatic-variable-guard/Test-PowerShell-VariableProviderCurrentLocationCanary.ps1'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/public-powershell-variable-provider-current-location-canary.yml'
      - 'diagnostics/powershell-automatic-variable-guard/Test-PowerShell-VariableProviderCurrentLocationCanary.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact diagnostic revision
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "CURRENT_LOCATION_CANARY_HEAD_MISMATCH expected=$env:EXPECTED_SHA actual=$actual" }
      - name: Probe current-location provider semantics on Windows PowerShell 5.1
        shell: powershell
        run: .\diagnostics\powershell-automatic-variable-guard\Test-PowerShell-VariableProviderCurrentLocationCanary.ps1
      - name: Probe current-location provider semantics on PowerShell 7
        shell: pwsh
        run: .\diagnostics\powershell-automatic-variable-guard\Test-PowerShell-VariableProviderCurrentLocationCanary.ps1
