name: Public PowerShell Variable Provider Guard

on:
  push:
    branches:
      - diagnostics/public-standard-hosted-runner-canary-20260822
    paths:
      - '.github/workflows/public-powershell-variable-provider-guard.yml'
      - 'diagnostics/powershell-automatic-variable-guard/Test-Scripts.ps1'
      - 'diagnostics/powershell-automatic-variable-guard/Test-PowerShell-VariableProviderGuard.ps1'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/public-powershell-variable-provider-guard.yml'
      - 'diagnostics/powershell-automatic-variable-guard/Test-Scripts.ps1'
      - 'diagnostics/powershell-automatic-variable-guard/Test-PowerShell-VariableProviderGuard.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2022:
    name: windows-2022 variable-provider guard
    runs-on: windows-2022
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact diagnostic revision
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "VARIABLE_PROVIDER_GUARD_HEAD_MISMATCH expected=$env:EXPECTED_SHA actual=$actual" }

      - name: Run provider guard on Windows PowerShell 5.1
        shell: powershell
        run: .\diagnostics\powershell-automatic-variable-guard\Test-PowerShell-VariableProviderGuard.ps1

      - name: Run provider guard on PowerShell 7
        shell: pwsh
        run: .\diagnostics\powershell-automatic-variable-guard\Test-PowerShell-VariableProviderGuard.ps1

  windows-latest:
    name: windows-latest variable-provider guard
    runs-on: windows-latest
    steps:
      - name: Checkout exact diagnostic revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact diagnostic revision
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "VARIABLE_PROVIDER_GUARD_HEAD_MISMATCH expected=$env:EXPECTED_SHA actual=$actual" }

      - name: Run provider guard on Windows PowerShell 5.1
        shell: powershell
        run: .\diagnostics\powershell-automatic-variable-guard\Test-PowerShell-VariableProviderGuard.ps1

      - name: Run provider guard on PowerShell 7
        shell: pwsh
        run: .\diagnostics\powershell-automatic-variable-guard\Test-PowerShell-VariableProviderGuard.ps1
